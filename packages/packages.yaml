# packages.yaml — flat package registry
#
# Bare string = brew (mac) / apt (linux)
# Key-value = override defaults
#
#   source:   brew (default) | cask | tap | cargo | npm | uv | gh-extension
#   dev:      only when DOTFILES_DEV=true
#   apt:      override name for linux
#   platform: mac | linux (default: both)
#   flags:    extra args spliced into the installer (uv source only;
#             e.g. ["--python", "3.13", "--prerelease=allow"])
#   git:      cargo git URL (cargo source only)
#   branch:   git branch for cargo git installs
#   greedy:   cask upgrade control (cask source only)
#
# This starter list contains only what the machinery itself needs to run:
#   - chezmoi: dotfiles manager (dots sync)
#   - yq: YAML parsing (packages/sync.sh reads packages.yaml)
#   - jq: JSON processing (used by hook scripts)
#   - git: version control
#   - bats-core: test runner (dots test)
#   - uv: Python tool runner (agent-profile / ap)
#   - shellcheck: shell linting (justfile lint-shell)
#   - markdownlint-cli2: markdown linting (justfile lint-markdown)
#   - just: task runner (justfile)
#   - prek: pre-commit runner
#
# Catalog packages (MCPs, productivity tools, editors, etc.) are in
# onboard/catalog/packages.yaml — added during onboarding (Phase B/C).

packages:
  # Machinery requirements
  - chezmoi
  - yq
  - jq
  - git
  - bats-core: { apt: bats }                  # bats test runner; brew formula is bats-core, apt pkg is bats
  - uv
  - shellcheck
  - just
  - prek

  # Linters (needed by justfile lint targets)
  - markdownlint-cli2: { source: npm }

  # Node (required by jq/npm-sourced tools and MCP servers)
  - node: { apt: nodejs }
